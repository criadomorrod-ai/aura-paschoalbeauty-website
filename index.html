section{padding:64px 20px;max-width:960px;margin:0 auto}

.sub{color:var(--mut);margin:0 0 28px;max-width:60ch}

function say(x,me){const d=document.createElement("div");d.textContent=x;if(me)d.className="me";$("log").append(d);$("log").scrollTop=1e9}
const norm=x=>x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function reply(q){
q=norm(q);
if(/micro/.test(q))return t("micro");
if(/pesta|lash|eyelash|cilios/.test(q)&&!/preco|precio|price|cuest|custa/.test(q))return t("lash");
const hit=S.filter(s=>{const n=norm(s.n);return n.split(/[ +\/]/).some(w=>w.length>4&&q.includes(w))||q.includes(n)}).sort((a,b)=>b.n.length-a.n.length)[0];
if(hit&&/preco|precio|price|cuest|custa|cost|quanto|cuanto|how much|duracao|duracion|long/.test(q))return t("price")(hit);
if(/horari|hora|abre|abr[ie]|open|hours|schedule|cuando|quando|when/.test(q))return t("hrs");
if(/marcar|reserv|cita|book|appoint|agendar/.test(q))return t("bookr");
if(hit)return t("price")(hit);
return t("human");
}
